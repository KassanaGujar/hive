appId: app.hive.desktop
productName: Hive
directories:
  output: release/${version}
  buildResources: build
files:
  - out/**
  - package.json
asarUnpack:
  - node_modules/@lydell/**
# node-pty ships prebuilt binaries per OS/chip; nothing needs compiling.
npmRebuild: false
afterPack: build/afterPack.cjs
extraResources:
  - from: ../../catalog/catalog.json
    to: catalog.json
protocols:
  - name: Hive invite
    schemes: [hive]
win:
  target: [nsis]
  artifactName: Hive-Setup-${version}.${ext}
nsis:
  oneClick: true
  perMachine: false
  allowElevation: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Hive
  runAfterFinish: true
  deleteAppDataOnUninstall: false
mac:
  # Separate downloads for Apple Silicon (M1–M4) and Intel Macs.
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  category: public.app-category.developer-tools
  artifactName: Hive-${version}-mac-${arch}.${ext}
  # Unsigned beta: skip Developer ID signing; afterPack applies an ad-hoc signature instead.
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
dmg:
  title: Hive ${version}
linux:
  target: [AppImage]
  category: Development
  artifactName: Hive-${version}.${ext}
publish:
  provider: github
  owner: KassanaGujar
  repo: hive
  releaseType: release
