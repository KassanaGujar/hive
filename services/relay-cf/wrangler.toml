name = "hive-relay"
main = "src/worker.ts"
compatibility_date = "2026-10-01"

# One Durable Object per project room (holds the encrypted update log), plus one for invite codes.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "INVITES"
class_name = "Invites"

# SQLite-backed Durable Objects are available on the Workers free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room", "Invites"]
